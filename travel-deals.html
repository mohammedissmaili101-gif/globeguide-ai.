<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Deals Scanner | GlobeGuide AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-200">
    <main class="max-w-6xl mx-auto px-4 py-12">
        <div class="flex items-center gap-3 mb-8">
            <div class="w-3 h-3 bg-emerald-500 rounded-full animate-ping"></div>
            <span class="font-mono text-emerald-500 text-sm tracking-tighter">BOT STATUS: SCANNING GLOBAL AGENCIES...</span>
        </div>
        
        <h1 class="text-4xl font-black text-white mb-4">Latest Travel <span class="text-emerald-500 italic">Deals</span></h1>
        <p class="text-slate-400 mb-12">Our AI agent scans international sources to find the most recent travel offers and agency updates.</p>

        <div id="deals-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20 text-slate-600 font-mono italic">
                Gathering real-time offers...
            </div>
        </div>
    </main>

    <script>
        async function fetchDeals() {
            const grid = document.getElementById('deals-grid');
            try {
                const res = await fetch('/api/deals');
                const data = await res.json();
                grid.innerHTML = '';
                data.articles.slice(0, 12).forEach(deal => {
                    grid.innerHTML += `
                        <div class="bg-slate-900 border border-slate-800 p-5 rounded-2xl hover:border-emerald-500/50 transition duration-500">
                            <img src="${deal.urlToImage || 'https://via.placeholder.com/400x200'}" class="w-full h-40 object-cover rounded-xl mb-4">
                            <span class="text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-1 rounded font-bold uppercase">${deal.source.name}</span>
                            <h3 class="font-bold text-white mt-3 mb-2 line-clamp-2">${deal.title}</h3>
                            <p class="text-slate-500 text-xs line-clamp-3 mb-4">${deal.description || ''}</p>
                            <a href="${deal.url}" target="_blank" class="block text-center bg-white text-black py-2 rounded-lg text-xs font-black hover:bg-emerald-500 hover:text-white transition">VIEW DEAL</a>
                        </div>`;
                });
            } catch (e) {
                grid.innerHTML = '<p class="text-red-400">Failed to connect to the bot.</p>';
            }
        }
        fetchDeals();
    </script>
</body>
</html>
