<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Travel News | GlobeGuide AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans">
    <header class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600 italic">GlobeGuide <span class="text-gray-900">Live</span></h1>
            <a href="index.html" class="text-sm font-medium text-gray-500 hover:text-blue-600">Home</a>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="text-center mb-12">
            <h2 class="text-3xl font-black text-gray-900 uppercase tracking-tighter">Global Travel Intelligence</h2>
            <p class="text-gray-500 mt-2">Latest updates on visas, destinations, and AI travel trends.</p>
        </div>

        <div id="news-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <div class="col-span-full text-center py-20">
                <div class="inline-block animate-spin rounded-full h-8 w-8 border-t-2 border-blue-600"></div>
            </div>
        </div>
    </main>

    <script>
        async function loadNews() {
            const container = document.getElementById('news-grid');
            try {
                // كنعيطو للملف ديال الـ API اللي صايبنا فـ Vercel
                const res = await fetch('/api/news');
                const data = await res.json();
                
                container.innerHTML = '';
                data.articles.slice(0, 15).forEach(art => {
                    container.innerHTML += `
                        <div class="bg-white rounded-lg shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition">
                            <img src="${art.urlToImage || 'https://via.placeholder.com/400x200'}" class="w-full h-40 object-cover">
                            <div class="p-4">
                                <span class="text-[10px] font-bold text-blue-500 uppercase">${art.source.name}</span>
                                <h3 class="font-bold text-gray-900 mt-1 mb-2 line-clamp-2">${art.title}</h3>
                                <p class="text-gray-600 text-xs line-clamp-3 mb-4">${art.description || ''}</p>
                                <a href="${art.url}" target="_blank" class="text-blue-600 text-xs font-bold hover:underline">READ REPORT →</a>
                            </div>
                        </div>`;
                });
            } catch (e) {
                container.innerHTML = '<p class="col-span-full text-center text-red-500">Error loading news.</p>';
            }
        }
        loadNews();
    </script>
</body>
</html>
