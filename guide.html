<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">GlobeGuide AI | Premium Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="/database.js"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .prose h2 { font-size: 2.25rem; font-weight: 800; color: #1e3a8a; margin-top: 2rem; margin-bottom: 1rem; border-left: 5px solid #2563eb; padding-left: 1rem; }
        .prose h3 { font-size: 1.6rem; font-weight: 700; color: #2563eb; margin-top: 1.5rem; }
        .prose p { font-size: 1.15rem; line-height: 1.8; color: #334155; margin-bottom: 1.5rem; }
        .prose ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 1.5rem; }
    </style>
</head>
<body class="bg-slate-50">
    <div class="relative h-[50vh] bg-slate-900 overflow-hidden">
        <img id="hero-img" src="https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=1200" class="w-full h-full object-cover opacity-40">
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center px-6">
            <span class="text-blue-400 font-bold tracking-[0.3em] uppercase text-[10px] mb-4">Satellite Verified Intelligence</span>
            <h1 id="main-title" class="text-white text-5xl md:text-7xl font-black uppercase tracking-tighter mb-4">Loading...</h1>
            <div class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold text-[10px] uppercase tracking-widest">Global Node 2026</div>
        </div>
    </div>

    <main class="max-w-4xl mx-auto -mt-16 relative z-10 bg-white shadow-2xl rounded-[40px] p-8 md:p-16 mb-20">
        <div id="content" class="prose prose-slate max-w-none min-h-[300px]">
            </div>
        
        <div class="mt-12 pt-12 border-t border-slate-100 flex flex-col items-center text-center">
            <p class="text-slate-400 font-bold uppercase text-[9px] tracking-[0.2em] mb-6">Powered by Focushive Intelligence</p>
            <a href="/" class="bg-slate-900 text-white px-8 py-4 rounded-full font-black text-[10px] hover:bg-blue-600 transition-all uppercase tracking-widest">Return to Dashboard</a>
        </div>
    </main>

    <script>
        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            const citySlug = params.get('city');
            
            // التأكد من أن database.js محملة
            if (typeof articlesData !== 'undefined') {
                const data = articlesData.find(a => a.slug === citySlug);

                if(data) {
                    document.getElementById('page-title').innerText = data.city + " | 2026 Travel Guide";
                    document.getElementById('main-title').innerText = data.city;
                    document.getElementById('content').innerHTML = data.content;
                    // جلب صورة أوتوماتيكية للمدينة
                    document.getElementById('hero-img').src = `https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1200&q=80`;
                } else {
                    document.getElementById('content').innerHTML = `<h2>Destination Not Found</h2><p>Our satellite feed couldn't locate data for <strong>${citySlug}</strong>. Please return to the dashboard.</p>`;
                }
            } else {
                document.getElementById('content').innerHTML = "<p class='text-red-500 font-bold'>Error: database.js not found in the root directory.</p>";
            }
        };
    </script>
</body>
</html>
