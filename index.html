<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeGuide AI | Premium AI Travel Itinerary Planner</title>
    
    <meta name="google-site-verification" content="pek_oHFsRrtgR_Y6ti-HMARB3N1V5Zg0nqj-YD_eIKc" />
    <meta name="google-site-verification" content="XgriFXyJ2kBxp_XLdOugWo2Q3ifdF8wil6UqHaD877E" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="database.js"></script>

    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg); color: #0f172a; overflow-x: hidden; scroll-behavior: smooth; }
        
        .prose h2 { font-size: 2.25rem !important; font-weight: 800 !important; color: #1e3a8a !important; margin-top: 3.5rem !important; margin-bottom: 1rem !important; border-left: 6px solid #2563eb; padding-left: 1.5rem; line-height: 1.2; text-transform: uppercase; }
        .prose h3 { font-size: 1.6rem !important; font-weight: 700 !important; color: #2563eb !important; margin-top: 2rem !important; margin-bottom: 0.5rem !important; }
        .prose p { font-size: 1.125rem !important; line-height: 1.8 !important; color: #475569 !important; margin-bottom: 1.5rem !important; }
        
        .hero-mesh { background-image: radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 50%), radial-gradient(at 100% 0%, rgba(139, 92, 246, 0.05) 0px, transparent 50%); }
        .search-container { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.3); box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.06); border-radius: 40px; }
        
        .article-card { transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); background: white; border-radius: 35px; border: 1px solid #f1f5f9; cursor: pointer; }
        .article-card:hover { transform: translateY(-12px); box-shadow: 0 30px 60px rgba(0,0,0,0.08); border-color: #2563eb; }
        
        #google_translate_element select { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 6px 12px; font-weight: 700; font-size: 12px; outline: none; }
    </style>
</head>

<body class="hero-mesh min-h-screen">
    <nav class="max-w-7xl mx-auto px-6 py-8 flex justify-between items-center sticky top-0 z-50 bg-white/50 backdrop-blur-md border-b border-white/20">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-600/20">
                <span class="text-white font-black italic text-xl">G</span>
            </div>
            <span class="text-xl font-extrabold tracking-tighter">GlobeGuide<span class="text-blue-600">.ai</span></span>
        </div>
        
        <div class="flex items-center gap-4">
            <div id="google_translate_element"></div>
            <a href="contact.html" class="text-xs font-bold bg-white border border-slate-200 px-6 py-3 rounded-full hover:bg-slate-50 transition shadow-sm">Support</a>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 pt-16 pb-24 text-center">
        <h1 class="text-5xl md:text-8xl font-black text-slate-900 mb-8 leading-[1.1] tracking-tight">Stop Searching. <br><span class="text-transparent bg-clip-text bg-gradient-to-r from-blue-600 to-indigo-600 font-serif italic">Start Exploring.</span></h1>
        
        <div class="search-container p-3 max-w-4xl mx-auto flex flex-col md:flex-row gap-2">
            <div class="flex-1 flex items-center px-6">
                <span class="text-xl mr-3">📍</span>
                <input id="city" type="text" placeholder="Where do you want to go?" class="w-full bg-transparent py-4 outline-none font-bold text-slate-700">
            </div>
            <select id="days" class="bg-transparent px-6 py-4 outline-none font-bold text-slate-500 border-x">
                <option value="3">3 Days</option><option value="5">5 Days</option><option value="7">7 Days</option>
            </select>
            <button id="planBtn" onclick="planMyTrip()" class="bg-blue-600 text-white font-black px-12 py-5 rounded-[32px] text-sm uppercase tracking-widest hover:bg-blue-700 transition-all">Plan Trip</button>
        </div>

        <div id="loader" class="hidden mt-20 flex flex-col items-center">
            <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-blue-600 font-bold text-xs uppercase tracking-widest mt-4 animate-pulse">Syncing satellite intelligence...</p>
        </div>

        <div id="output" class="hidden mt-20 text-left bg-white p-8 md:p-16 rounded-[50px] shadow-2xl border border-slate-100"></div>

        <section class="mt-32 text-left">
            <div class="flex items-center gap-4 mb-12">
                <h2 class="text-3xl font-black italic uppercase tracking-tighter">Global Intelligence Feed</h2>
                <div class="h-[1px] flex-1 bg-slate-200"></div>
            </div>
            
            <div id="dynamic-articles" class="grid md:grid-cols-2 gap-10">
                <p class="text-slate-400 font-bold italic">Authenticating with Satellite Feed...</p>
            </div>
        </section>
    </main>

    <footer class="bg-white border-t border-slate-100 py-16 px-6 mt-20">
        <div class="max-w-5xl mx-auto text-center">
            <div class="flex justify-center gap-8 text-[10px] font-black uppercase tracking-[0.3em] text-slate-400 mb-8">
                <a href="privacy.html" class="hover:text-blue-600 transition-colors">Privacy Policy</a>
                <a href="terms.html" class="hover:text-blue-600 transition-colors">Terms of Use</a>
                <a href="contact.html" class="hover:text-blue-600 transition-colors">Contact Us</a>
            </div>
            <p class="text-[9px] text-slate-300 font-bold uppercase tracking-widest">© 2026 GLOBEGUIDE AI | POWERED BY FOCUSHIVE INTELLIGENCE</p>
        </div>
    </footer>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        // ✅ 1. نظام النشر التلقائي - النسخة المضمونة 100% (تعتمد على database.js)
        function fetchArticles() {
            const container = document.getElementById('dynamic-articles');
            
            try {
                // التأكد من أن البيانات محملة من ملف database.js
                if(typeof articlesData !== 'undefined' && articlesData.length > 0) {
                    container.innerHTML = '';
                    // عكس المصفوفة لعرض أحدث التقارير أولاً
                    [...articlesData].reverse().forEach(article => {
                        container.innerHTML += `
                            <div class="article-card p-10" onclick="window.location.href='${article.slug}'">
                                <span class="text-blue-600 font-bold text-[10px] uppercase tracking-widest mb-4 block">Premium Report</span>
                                <h3 class="text-3xl font-black mb-6 leading-tight text-slate-900">${article.city}</h3>
                                <p class="text-slate-500 text-sm mb-8 leading-relaxed font-medium italic text-balance">${article.desc}</p>
                                <div class="inline-block bg-slate-900 text-white px-10 py-4 rounded-full text-[10px] font-black uppercase tracking-widest hover:bg-blue-600 transition-all">Unlock Intelligence</div>
                            </div>`;
                    });
                } else {
                    container.innerHTML = '<p class="text-slate-400 font-bold italic">Waiting for new intelligence reports...</p>';
                }
            } catch (e) { 
                container.innerHTML = '<p class="text-slate-300">Satellite link syncing... Please ensure database.js is uploaded.</p>'; 
            }
        }

        // ✅ 2. نظام التخطيط والخرائط (محفوظ بالكامل كما هو)
        async function planMyTrip() {
            const city = document.getElementById('city').value;
            const days = document.getElementById('days').value;
            const output = document.getElementById('output');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('planBtn');

            if(!city) return;
            loader.classList.remove('hidden'); output.classList.add('hidden'); btn.disabled = true;

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ city, days })
                });
                const data = await response.json();

                const genericMap = `<iframe width="100%" height="450" style="border-radius:30px; margin-bottom:40px; border:none; box-shadow: 0 4px 20px rgba(0,0,0,0.05);" src="https://maps.google.com/maps?q=${encodeURIComponent(city)}&output=embed" frameborder="0"></iframe>`;

                output.innerHTML = `
                    <div id="pdf-area" class="p-2">
                        <div class="flex justify-between items-center mb-12 pb-8 border-b border-slate-100">
                            <div>
                                <h2 style="border:none; margin:0; font-size: 2.5rem; font-weight: 900; color:#1e3a8a;">${city.toUpperCase()}</h2>
                                <p class="text-blue-600 font-bold text-[10px] uppercase tracking-widest mt-2">Verified AI Master Itinerary</p>
                            </div>
                            <button onclick="downloadPDF()" class="text-[10px] font-black bg-slate-900 text-white px-6 py-3 rounded-full hover:bg-blue-600 transition shadow-xl">DOWNLOAD PDF</button>
                        </div>
                        ${genericMap}
                        <div class="prose prose-slate max-w-none">
                            ${data.content}
                        </div>
                    </div>
                `;
                output.classList.remove('hidden');
                output.scrollIntoView({ behavior: 'smooth' });
            } catch (e) { alert("Error generating intelligence."); }
            finally { loader.classList.add('hidden'); btn.disabled = false; }
        }

        function downloadPDF() {
            const element = document.getElementById('pdf-area');
            const cityName = document.getElementById('city').value;
            const opt = {
                margin: 0.5,
                filename: `GlobeGuide-${cityName}.pdf`,
                html2canvas: { scale: 2 },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }

        window.onload = fetchArticles;
    </script>
</body>
</html>
