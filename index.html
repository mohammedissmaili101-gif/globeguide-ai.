<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeGuide AI | Premium Itinerary Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #0f172a; }
        .prose h2 { font-size: 2rem; font-weight: 800; color: #1e3a8a; margin: 2rem 0 1rem; border-left: 5px solid #2563eb; padding-left: 1rem; }
        .prose h3 { font-size: 1.4rem; font-weight: 700; color: #2563eb; margin-top: 1.5rem; }
        .prose p { line-height: 1.7; color: #475569; margin-bottom: 1rem; }
        .itinerary-img { width: 100%; border-radius: 20px; margin: 1.5rem 0; box-shadow: 0 10px 20px rgba(0,0,0,0.05); display: block; }
        .map-frame { width: 100%; height: 350px; border-radius: 20px; margin-bottom: 2rem; border: none; }
        .hero-gradient { background: radial-gradient(circle at top right, #e0e7ff, transparent), radial-gradient(circle at top left, #f1f5f9, transparent); }
    </style>
</head>
<body class="hero-gradient min-h-screen">

    <nav class="p-8 max-w-7xl mx-auto flex justify-between items-center">
        <div class="font-black text-2xl tracking-tighter">GlobeGuide<span class="text-blue-600">.ai</span></div>
        <a href="mailto:mohammedissmaili101@gmail.com" class="text-sm font-bold bg-white px-6 py-2 rounded-full shadow-sm">Support</a>
    </nav>

    <main class="max-w-4xl mx-auto px-6 py-12 text-center">
        <h1 class="text-6xl font-black mb-6 tracking-tight">Your Next Adventure, <br><span class="text-blue-600 italic font-serif">AI-Perfected.</span></h1>
        
        <div class="bg-white p-4 rounded-[35px] shadow-xl flex flex-col md:flex-row gap-2 mb-12 border border-slate-100">
            <input id="city" type="text" placeholder="Enter Destination" class="flex-1 px-6 py-4 outline-none font-bold text-lg">
            <select id="days" class="px-6 py-4 outline-none font-bold text-slate-500 border-x">
                <option value="3">3 Days</option>
                <option value="5">5 Days</option>
                <option value="7">7 Days</option>
            </select>
            <button id="planBtn" onclick="planTrip()" class="bg-blue-600 text-white px-10 py-4 rounded-[25px] font-black hover:bg-blue-700 transition">PLAN TRIP</button>
        </div>

        <div id="loader" class="hidden flex flex-col items-center py-10">
            <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
        </div>

        <div id="output" class="hidden text-left bg-white p-8 md:p-12 rounded-[40px] shadow-2xl mt-10">
            </div>
    </main>

    <script>
        async function planTrip() {
            const city = document.getElementById('city').value;
            const days = document.getElementById('days').value;
            const output = document.getElementById('output');
            const loader = document.getElementById('loader');
            const btn = document.getElementById('planBtn');

            if(!city) return alert("Please enter a city");

            loader.classList.remove('hidden');
            output.classList.add('hidden');
            btn.disabled = true;

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ city, days })
                });
                const data = await response.json();

                // Build Final Content with Map and Dynamic Images
                const genericMap = `<iframe class="map-frame" src="https://maps.google.com/maps?q=${encodeURIComponent(city)}&t=&z=13&ie=UTF8&iwloc=&output=embed"></iframe>`;
                
                let htmlContent = `
                    <div id="pdf-area">
                        <div class="flex justify-between items-center mb-8 border-b pb-6">
                            <h2 style="border:none; margin:0; padding:0;">${city.toUpperCase()}</h2>
                            <button onclick="downloadPDF()" class="bg-black text-white text-[10px] font-bold px-5 py-2 rounded-full">SAVE PDF</button>
                        </div>
                        ${genericMap}
                        <div class="prose">
                            ${data.content}
                        </div>
                    </div>
                `;

                output.innerHTML = htmlContent;

                // التعديل السحري للصور: كنقلبوا على العناوين ونزيدوا تحتهم تصويرة
                const headings = output.querySelectorAll('h2');
                headings.forEach((h, index) => {
                    if(index > 0) { // كنزيدو صورة لكل يوم من غير العنوان الرئيسي
                        const img = document.createElement('img');
                        img.src = `https://loremflickr.com/800/450/${encodeURIComponent(city)},travel/all?lock=${index}`;
                        img.className = 'itinerary-img';
                        img.alt = city;
                        h.after(img);
                    }
                });

                output.classList.remove('hidden');
            } catch (e) {
                alert("Error. Please try again.");
            } finally {
                loader.classList.add('hidden');
                btn.disabled = false;
            }
        }

        function downloadPDF() {
            const element = document.getElementById('pdf-area');
            const cityName = document.getElementById('city').value;
            const opt = {
                margin: 0.5,
                filename: `GlobeGuide-${cityName}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true },
                jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }
            };
            html2pdf().set(opt).from(element).save();
        }
    </script>
</body>
</html>
