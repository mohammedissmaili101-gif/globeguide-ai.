<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlobeGuide AI | Global Luxury Travel Intelligence</title>
    
    <meta name="google-site-verification" content="pek_oHFsRrtgR_Y6ti-HMARB3N1V5Zg0nqj-YD_eIKc" />
    <meta name="google-site-verification" content="XgriFXyJ2kBxp_XLdOugWo2Q3ifdF8wil6UqHaD877E" />
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #f8fafc; color: #0f172a; scroll-behavior: smooth; }
        .hero-mesh { background-image: radial-gradient(at 0% 0%, rgba(37, 99, 235, 0.05) 0px, transparent 50%); }
        .article-card { transition: all 0.4s ease; background: white; border-radius: 35px; border: 1px solid #f1f5f9; overflow: hidden; display: flex; flex-direction: column; }
        .article-card:hover { transform: translateY(-12px); box-shadow: 0 30px 60px rgba(0,0,0,0.1); }
        .day-card { background: white; padding: 35px; border-radius: 35px; border: 1px solid #f1f5f9; margin-bottom: 25px; }
        #google_translate_element { margin-left: 15px; }
    </style>
</head>

<body class="hero-mesh min-h-screen">

    <nav class="max-w-7xl mx-auto px-6 py-6 flex justify-between items-center sticky top-0 z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
        <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white font-black italic shadow-lg">G</div>
            <span class="text-xl font-extrabold italic tracking-tighter">GlobeGuide<span class="text-blue-600">.ai</span></span>
        </div>
        <div class="flex items-center">
            <div id="google_translate_element"></div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 pt-16">
        <div class="text-center mb-24">
            <h1 class="text-5xl md:text-7xl font-black mb-8 tracking-tighter leading-tight text-slate-900">
                Global Travel <br><span class="text-blue-600 italic">Curated by Intelligence.</span>
            </h1>
            <div class="bg-white p-3 rounded-[40px] shadow-2xl flex flex-col md:flex-row gap-2 max-w-4xl mx-auto border border-slate-100">
                <input id="city" type="text" placeholder="Your next destination..." class="flex-1 px-8 py-4 outline-none font-bold text-slate-700 bg-transparent">
                <button onclick="planMyTrip()" class="bg-blue-600 text-white font-black px-12 py-5 rounded-[32px] text-sm uppercase tracking-widest hover:bg-blue-700 transition-all shadow-lg shadow-blue-200">Plan Now</button>
            </div>
        </div>

        <div id="loader" class="hidden flex flex-col items-center mb-16">
            <div class="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
            <p class="mt-4 text-blue-600 font-bold text-[10px] uppercase tracking-widest">Designing Your Masterpiece...</p>
        </div>
        <div id="output" class="hidden mb-24"></div>

        <section class="py-10">
            <div class="flex items-center gap-4 mb-12">
                <h2 class="text-3xl font-black italic uppercase tracking-tighter">Global Intelligence Reports</h2>
                <div class="h-1 flex-1 bg-slate-100 rounded-full"></div>
            </div>
            
            <div id="dynamic-articles" class="grid md:grid-cols-2 gap-10">
                <p class="text-slate-400 font-bold italic animate-pulse">Syncing with Intelligence Hub...</p>
            </div>
        </section>
    </main>

    <footer class="bg-slate-950 text-white py-16 px-6 mt-20 text-center">
        <div class="max-w-5xl mx-auto">
            <div class="flex justify-center gap-8 text-[10px] font-black uppercase tracking-[0.3em] text-slate-600 mb-8">
                <a href="privacy.html">Privacy</a> <a href="terms.html">Terms</a> <a href="contact.html">Contact</a>
            </div>
            <p class="text-slate-800 text-[10px] font-black tracking-widest uppercase">© 2026 GLOBEGUIDE AI | POWERED BY FOCUSHIVE</p>
        </div>
    </footer>

    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        // ✅ سكريبت النشر التلقائي بمعلوماتك الصحيحة
        async function fetchArticles() {
            const username = 'mohammedissmaili101-gif'; 
            const repo = 'globeguide-ai'; 
            const container = document.getElementById('dynamic-articles');

            try {
                const response = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/`);
                const files = await response.json();
                const articles = files.filter(f => f.name.endsWith('-guide.html'));
                
                if(articles.length > 0) {
                    container.innerHTML = '';
                    articles.forEach(file => {
                        const cityName = file.name.replace('-guide.html', '').toUpperCase().replace('-', ' ');
                        const card = `
                            <div class="article-card">
                                <div class="p-10">
                                    <span class="text-blue-600 font-bold text-[10px] uppercase tracking-[0.3em] mb-4 block italic">Exclusive Insight</span>
                                    <h3 class="text-3xl font-black mb-6 leading-tight">${cityName} 2026</h3>
                                    <p class="text-slate-500 text-sm mb-8 leading-relaxed">Luxury travel intelligence and premium cultural discovery curated for ${cityName}.</p>
                                    <a href="${file.name}" class="inline-block bg-slate-900 text-white px-10 py-4 rounded-full text-[10px] font-black uppercase tracking-widest hover:bg-blue-600 transition-all">Read Full Report</a>
                                </div>
                            </div>`;
                        container.innerHTML += card;
                    });
                }
            } catch (e) { console.log("Fetch error"); }
        }

        async function planMyTrip() {
            const city = document.getElementById('city').value;
            const output = document.getElementById('output');
            const loader = document.getElementById('loader');
            if(!city) return alert("Enter city.");
            loader.classList.remove('hidden');
            output.classList.add('hidden');
            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ city, days: 3 })
                });
                const data = await response.json();
                output.innerHTML = `<div class="day-card"><h2 class="text-3xl font-black mb-8 border-b pb-4 italic uppercase tracking-tighter">${city} ITINERARY</h2><div class="prose max-w-none text-slate-600">${data.content}</div></div>`;
                output.classList.remove('hidden');
            } catch (e) { alert("Error."); }
            finally { loader.classList.add('hidden'); }
        }

        window.onload = fetchArticles;
    </script>
</body>
</html>
