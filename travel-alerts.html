<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Risk Radar | GlobeGuide AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-[#05070a] text-slate-300 min-h-screen">
    <main class="max-w-5xl mx-auto px-6 py-12">
        <div class="flex justify-between items-center mb-16">
            <a href="index.html" class="text-[10px] font-black tracking-[0.3em] text-slate-500 hover:text-red-500 transition-all uppercase">
                <i class="fas fa-long-arrow-alt-left mr-2"></i> Exit Radar
            </a>
            <div class="px-4 py-1 border border-red-500/30 rounded-full flex items-center gap-2">
                <div class="w-1.5 h-1.5 bg-red-500 rounded-full animate-pulse"></div>
                <span class="text-[9px] font-black text-red-500 uppercase tracking-widest">Live Risk Feed</span>
            </div>
        </div>

        <h1 class="text-4xl font-black text-white mb-4 uppercase tracking-tighter">Global Travel <span class="text-red-600 italic">Alerts</span></h1>
        <p class="text-slate-500 max-w-xl text-sm mb-12 border-l-2 border-slate-800 pl-6 font-mono">Real-time intelligence on strikes, visa changes, and safety updates across all continents.</p>

        <div id="alerts-container" class="space-y-6">
            <div class="animate-pulse flex flex-col gap-4">
                <div class="h-20 bg-slate-900/50 rounded-3xl"></div>
                <div class="h-20 bg-slate-900/50 rounded-3xl"></div>
            </div>
        </div>
    </main>

    <script>
        async function fetchAlerts() {
            const container = document.getElementById('alerts-container');
            try {
                const res = await fetch('/api/alerts');
                const data = await res.json();
                container.innerHTML = '';
                
                data.articles.slice(0, 10).forEach(alert => {
                    container.innerHTML += `
                        <div class="group bg-slate-900/30 border border-slate-800/50 p-6 rounded-[2rem] hover:bg-red-950/10 hover:border-red-900/30 transition-all duration-500">
                            <div class="flex flex-col md:flex-row md:items-center gap-6">
                                <div class="flex-grow">
                                    <div class="flex items-center gap-3 mb-3">
                                        <span class="text-[9px] font-black text-red-500 uppercase tracking-[0.2em] bg-red-500/10 px-2 py-0.5 rounded">High Priority</span>
                                        <span class="text-[9px] font-bold text-slate-600 uppercase font-mono">${new Date(alert.publishedAt).toLocaleDateString()}</span>
                                    </div>
                                    <h3 class="text-lg font-bold text-slate-200 mb-2 group-hover:text-white transition">${alert.title}</h3>
                                    <p class="text-xs text-slate-500 line-clamp-2 italic">${alert.description || 'Connecting to source for full intelligence report...'}</p>
                                </div>
                                <a href="${alert.url}" target="_blank" class="shrink-0 w-12 h-12 rounded-full border border-slate-700 flex items-center justify-center hover:bg-white hover:text-black transition-all">
                                    <i class="fas fa-external-link-alt text-xs"></i>
                                </a>
                            </div>
                        </div>`;
                });
            } catch (e) {
                container.innerHTML = '<p class="text-red-500 font-mono text-xs text-center uppercase">Uplink Interrupted. Radar Offline.</p>';
            }
        }
        fetchAlerts();
    </script>
</body>
</html>
