<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI War Room | Global Intelligence Uplink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;700&family=JetBrains+Mono&display=swap');
        body { font-family: 'Space Grotesk', sans-serif; background: #020617; color: #94a3b8; overflow-x: hidden; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .glow-emerald { text-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        .terminal-scroll::-webkit-scrollbar { width: 4px; }
        .terminal-scroll::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body class="p-6 md:p-12 min-h-screen">

    <div class="max-w-6xl mx-auto">
        <div class="flex justify-between items-center mb-16">
            <a href="index.html" class="mono text-[10px] text-slate-500 hover:text-emerald-400 transition uppercase tracking-[0.4em]">
                <i class="fas fa-arrow-left mr-2"></i> Exit_Terminal
            </a>
            <div class="flex items-center gap-4 bg-slate-900/80 px-5 py-2.5 rounded-full border border-emerald-500/20 shadow-[0_0_20px_rgba(16,185,129,0.05)]">
                <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse shadow-[0_0_10px_#10b981]"></div>
                <span class="mono text-[10px] text-emerald-500 font-bold uppercase tracking-widest">Satellite Link: Established</span>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-10">
            
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-slate-900/40 border border-slate-800 p-8 rounded-[2.5rem] text-center backdrop-blur-xl">
                    <h3 class="mono text-[10px] uppercase mb-6 tracking-[0.2em] text-slate-500">Stability_Index</h3>
                    <div id="stability-score" class="text-7xl font-bold text-white mb-2 glow-emerald">--</div>
                    <p id="stability-status" class="text-[9px] uppercase font-black tracking-widest">Syncing Nodes...</p>
                    <div class="mt-8 h-1.5 w-full bg-slate-800 rounded-full overflow-hidden">
                        <div id="stability-bar" class="h-full bg-emerald-500 transition-all duration-1000" style="width: 0%"></div>
                    </div>
                </div>
                
                <div class="p-6 border border-slate-800/50 rounded-3xl bg-slate-950/50">
                    <p class="mono text-[8px] uppercase text-slate-600 mb-4 tracking-widest">Active_Agents</p>
                    <div class="space-y-3">
                        <div class="flex items-center gap-3 text-[10px] mono text-emerald-500/70"><i class="fas fa-check-circle"></i> ECON_ANALYST_01</div>
                        <div class="flex items-center gap-3 text-[10px] mono text-emerald-500/70"><i class="fas fa-check-circle"></i> RISK_WATCHDOG_02</div>
                        <div class="flex items-center gap-3 text-[10px] mono text-emerald-500/70"><i class="fas fa-sync animate-spin"></i> VIBE_SCOUT_03</div>
                    </div>
                </div>
            </div>

            <div class="lg:col-span-3">
                <div class="flex items-baseline gap-4 mb-8">
                    <h2 class="text-4xl font-bold text-white tracking-tighter italic">Live Intel <span class="text-slate-800">Uplink</span></h2>
                    <span class="mono text-[9px] text-slate-600">v2.0.4-STABLE</span>
                </div>

                <div id="intel-feed" class="space-y-4 terminal-scroll max-h-[70vh] overflow-y-auto pr-4">
                    <div class="animate-pulse flex flex-col gap-4">
                        <div class="h-24 bg-slate-900/50 rounded-3xl"></div>
                        <div class="h-24 bg-slate-900/50 rounded-3xl"></div>
                        <div class="h-24 bg-slate-900/50 rounded-3xl"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchIntelligence() {
            try {
                const res = await fetch('/api/intelligence');
                const data = await res.json();
                const analysis = data.analysis;
                
                const feed = document.getElementById('intel-feed');
                feed.innerHTML = '';
                
                let totalScore = 0;

                analysis.forEach(item => {
                    totalScore += item.impactScore;
                    const isPositive = item.impactScore >= 60;
                    const colorClass = isPositive ? 'text-emerald-400' : 'text-amber-500';
                    const borderColor = isPositive ? 'hover:border-emerald-500/30' : 'hover:border-amber-500/30';
                    const icon = isPositive ? 'fa-shield-alt' : 'fa-exclamation-triangle';
                    
                    feed.innerHTML += `
                        <div onclick="window.open('${item.url}', '_blank')" 
                             class="bg-slate-900/30 border border-slate-800/50 p-6 rounded-[2rem] flex justify-between items-center group cursor-pointer ${borderColor} hover:bg-slate-800/20 transition-all duration-500">
                            <div class="flex-grow pr-6">
                                <div class="flex items-center gap-3 mb-3">
                                    <span class="mono text-[9px] font-bold text-slate-500 uppercase tracking-widest">${item.source}</span>
                                    <span class="h-px w-6 bg-slate-800 group-hover:w-12 transition-all duration-500"></span>
                                    <i class="fas ${icon} text-[9px] ${colorClass}"></i>
                                    <span class="mono text-[9px] font-bold ${colorClass} uppercase tracking-tighter">Impact: ${item.impactScore}%</span>
                                </div>
                                <h4 class="text-sm md:text-base font-bold text-slate-300 group-hover:text-white transition-colors line-clamp-2 leading-relaxed">
                                    ${item.headline}
                                </h4>
                            </div>
                            <div class="shrink-0 flex items-center justify-center w-12 h-12 rounded-2xl border border-slate-800 bg-slate-950 group-hover:bg-emerald-500 group-hover:text-black transition-all duration-500">
                                <i class="fas fa-external-link-alt text-xs"></i>
                            </div>
                        </div>
                    `;
                });

                // Update UI Stats
                const finalAvg = Math.round(totalScore / analysis.length);
                document.getElementById('stability-score').innerText = finalAvg + '%';
                document.getElementById('stability-bar').style.width = finalAvg + '%';
                document.getElementById('stability-status').innerText = finalAvg > 65 ? 'GLOBAL_STABILITY: HIGH' : 'GLOBAL_STABILITY: CAUTION';
                document.getElementById('stability-status').className = `mono text-[9px] font-black tracking-widest ${finalAvg > 65 ? 'text-emerald-500' : 'text-amber-500'}`;

            } catch (err) {
                console.error("Link Failed:", err);
                document.getElementById('intel-feed').innerHTML = '<p class="mono text-red-500 text-xs uppercase">>> Critical Error: Intelligence Uplink Offline</p>';
            }
        }

        // Initial Load
        fetchIntelligence();
        // Refresh every 5 minutes
        setInterval(fetchIntelligence, 300000);
    </script>
</body>
</html>
